    let currentLang = "ar";
    const solvedSet = new Set();

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderLesson(lesson) {
      const subsectionsHtml = lesson.subsections
        .map((sub) => {
          const paras = (sub.paragraphs || [])
            .map((p) => `<p>${p}</p>`)
            .join("");
          const bullets = sub.bullets
            ? `<ul class="minpy-list">${sub.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`
            : "";
          const codeBlock = sub.code
            ? `<pre><code>${escapeHtml(sub.code)}</code></pre>`
            : "";
          const outputBlock = sub.output
            ? `<div class="minpy-output"><span class="minpy-output-label">OUTPUT</span>${escapeHtml(sub.output).replace(/\n/g, "<br>")}</div>`
            : "";
          const traceBlock = sub.trace
            ? `<div class="minpy-trace"><span class="minpy-trace-title">خطوة بخطوة (Step-by-Step)</span>${sub.trace
                .map((t, idx) => `<div class="minpy-trace-step"><strong>${idx + 1}.</strong> ${t}</div>`)
                .join("")}</div>`
            : "";
          return `
            <h3 class="minpy-h3">${escapeHtml(sub.title)}</h3>
            ${paras}
            ${bullets}
            ${codeBlock}
            ${outputBlock}
            ${traceBlock}
          `;
        })
        .join("");

      const introParas = lesson.intro.map((p) => `<p>${p}</p>`).join("");
      const analogyLines = lesson.analogy.lines.map((l) => `<p>${l}</p>`).join("");

      return `
        <section class="minpy-section" id="${escapeHtml(lesson.id)}">
          <span class="minpy-kicker">${escapeHtml(lesson.kicker)}</span>
          <h2 class="minpy-h2">${escapeHtml(lesson.heading)}</h2>
          ${introParas}
          <div class="minpy-analogy">
            <span class="minpy-analogy-title">${escapeHtml(lesson.analogy.title)}</span>
            ${analogyLines}
          </div>
          ${subsectionsHtml}
          <div class="minpy-mistake">
            <span class="minpy-mistake-title">${escapeHtml(lesson.mistake.title)}</span>
            <p>${escapeHtml(lesson.mistake.text)}</p>
          </div>
          <div class="minpy-summary">
            <span class="minpy-summary-title">خلاصة الدرس</span>
            <p>${escapeHtml(lesson.summary)}</p>
          </div>
        </section>
      `;
    }

    function renderLab(lab, data) {
      const total = lab.challenges.length;
      const pct = Math.round((solvedSet.size / total) * 100);
      const cardsHtml = lab.challenges
        .map((ch) => {
          const isSolved = solvedSet.has(ch.id);
          return `
            <div class="minpy-lab-card" id="card-${escapeHtml(ch.id)}">
              <div class="minpy-lab-header">
                <span class="minpy-lab-badge">${escapeHtml(ch.badge)}</span>
                <span class="minpy-lab-score">${isSolved ? "✓" : ""}</span>
              </div>
              <p><strong>${escapeHtml(ch.prompt)}</strong></p>
              <div class="code-box">
                ${escapeHtml(ch.codeBefore)}<input type="text" class="quiz-input" id="input-${escapeHtml(ch.id)}" size="12" aria-label="${escapeHtml(ch.badge)}" />${escapeHtml(ch.codeAfter)}
              </div>
              <div class="minpy-btn-row">
                <button type="button" class="run-btn" data-action="check" data-qid="${escapeHtml(ch.id)}">${escapeHtml(lab.checkBtn)}</button>
                <button type="button" class="minpy-sec-btn" data-action="hint" data-qid="${escapeHtml(ch.id)}">${escapeHtml(lab.hintBtn)}</button>
                <button type="button" class="minpy-sec-btn" data-action="reset" data-qid="${escapeHtml(ch.id)}">${escapeHtml(lab.resetBtn)}</button>
              </div>
              <div class="feedback" id="fb-${escapeHtml(ch.id)}"></div>
            </div>
          `;
        })
        .join("");

      return `
        <section class="minpy-section" id="lab-new-3">
          <span class="minpy-kicker">${escapeHtml(lab.kicker)}</span>
          <h2 class="minpy-h2">${escapeHtml(lab.heading)}</h2>
          <p>${escapeHtml(lab.subtitle)}</p>
          <div class="minpy-progress-wrap">
            <span class="minpy-lab-score" id="lab-score-text">${escapeHtml(lab.scorePrefix)}${solvedSet.size} / ${total}</span>
            <div class="minpy-progress-track">
              <div class="minpy-progress-fill" id="lab-progress-fill" style="width: ${pct}%;"></div>
            </div>
          </div>
          ${cardsHtml}
        </section>
      `;
    }

    function render() {
      const wrapper = document.getElementById("minpy-unit-wrapper");
      if (!wrapper) return;
      const data = LESSON_THREE_NEW_FIVE[currentLang];
      wrapper.setAttribute("dir", data.dir);

      const roadmapHtml = data.roadmap
        .map((r) => `<div class="minpy-pill"><strong>${escapeHtml(r.step)}</strong><span>${escapeHtml(r.name)}</span></div>`)
        .join("");

      const tocHtml = data.toc
        .map((t) => `<a class="minpy-toc-link" href="${escapeHtml(t.href)}">${escapeHtml(t.label)}</a>`)
        .join("");

      const lessonsHtml = data.lessons.map(renderLesson).join("");
      const labHtml = renderLab(data.lab, data);

      wrapper.innerHTML = `
        <div class="minpy-top-bar">
          <span class="tag">${escapeHtml(data.badgeText)}</span>
          <button type="button" class="minpy-lang-btn" id="minpy-toggle-lang">${escapeHtml(data.langBtnText)}</button>
        </div>
        <div class="minpy-meta-info">${escapeHtml(data.metaText)}</div>
        <h1>${escapeHtml(data.title)}</h1>
        <div class="minpy-abstract">
          <strong class="welcome-banner">${escapeHtml(data.welcome)}</strong>
          ${escapeHtml(data.abstract)}
        </div>
        <div class="minpy-roadmap">${roadmapHtml}</div>
        <div class="minpy-toc">
          <div class="minpy-toc-title">${escapeHtml(data.tocTitle)}</div>
          <div class="minpy-toc-grid">${tocHtml}</div>
        </div>
        ${lessonsHtml}
        ${labHtml}
      `;

      const toggleBtn = document.getElementById("minpy-toggle-lang");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          currentLang = currentLang === "ar" ? "en" : "ar";
          render();
        });
      }

      wrapper.querySelectorAll("button[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const action = btn.getAttribute("data-action");
          const qid = btn.getAttribute("data-qid");
          const ch = data.lab.challenges.find((item) => item.id === qid);
          const input = document.getElementById("input-" + qid);
          const fb = document.getElementById("fb-" + qid);
          if (!ch || !input || !fb) return;

          if (action === "hint") {
            fb.className = "feedback hint";
            fb.textContent = ch.hint;
          } else if (action === "reset") {
            input.value = "";
            solvedSet.delete(qid);
            fb.className = "feedback";
            fb.textContent = "";
            updateScore(data.lab);
          } else if (action === "check") {
            const val = input.value.trim().toLowerCase();
            if (ch.answers.includes(val)) {
              solvedSet.add(qid);
              fb.className = "feedback ok";
              fb.textContent = ch.okMsg;
            } else {
              fb.className = "feedback err";
              fb.textContent = ch.errMsg;
            }
            updateScore(data.lab);
          }
        });
      });
    }

    function updateScore(lab) {
      const scoreEl = document.getElementById("lab-score-text");
      const fillEl = document.getElementById("lab-progress-fill");
      const total = lab.challenges.length;
      if (scoreEl) scoreEl.textContent = `${lab.scorePrefix}${solvedSet.size} / ${total}`;
      if (fillEl) fillEl.style.width = `${Math.round((solvedSet.size / total) * 100)}%`;
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", render);
    } else {
      render();
    }
  })();
</script>
