              accept: (v) => v.trim() === "4"
            },
            {
              id: "q25",
              lessonTag: "Lesson 13 (File 3 • Lesson 3) • Question 1 of 2",
              type: "mcq",
              prompt: "What happens if you write has_key = true (lowercase t) in Python?",
              options: [
                "It works identically to True",
                "It becomes a string automatically",
                "It raises a NameError because booleans in Python must be capitalized (True / False)",
                "It evaluates to 0"
              ],
              correctIndex: 2,
              hint: "Python keywords True and False are case-sensitive.",
              okMsg: "Correct! True and False must start with uppercase letters.",
              errMsg: "Incorrect. Lowercase true raises a NameError."
            },
            {
              id: "q26",
              lessonTag: "Lesson 13 (File 3 • Lesson 3) • Question 2 of 2",
              type: "input",
              prompt: "When the key is missing, what boolean value is assigned to has_key?",
              before: "has_key = ",
              after: "\nprint(\"Key available:\", has_key)",
              placeholder: "boolean",
              hint: "Use capitalized False.",
              okMsg: "Correct! False represents missing availability.",
              errMsg: "The correct value is False.",
              accept: (v) => v.trim() === "False"
            },
            {
              id: "q27",
              lessonTag: "Lesson 14 (File 3 • Lesson 4) • Question 1 of 2",
              type: "mcq",
              prompt: "What does this conditional code print?",
              code: "score = 3\nif score > 5:\n    print(\"High score\")\nelse:\n    print(\"Keep going\")",
              options: ["High score", "Keep going", "Both messages", "Nothing"],
              correctIndex: 1,
              hint: "3 > 5 is False, so execution enters the else block.",
              okMsg: "Correct! Keep going is printed.",
              errMsg: "Incorrect. Because 3 > 5 is False, Keep going is printed."
            },
            {
              id: "q28",
              lessonTag: "Lesson 14 (File 3 • Lesson 4) • Question 2 of 2",
              type: "input",
              prompt: "Enter the missing punctuation symbol at the end of the if header:",
              before: "if score > 5",
              after: "\n    print(\"High score\")",
              placeholder: "symbol",
              hint: "Conditional headers end with a colon :",
              okMsg: "Correct! A colon (:) starts the indented block.",
              errMsg: "The correct symbol is :",
              accept: (v) => v.trim() === ":"
            },
            {
              id: "q29",
              lessonTag: "Lesson 15 (File 3 • Lesson 5) • Question 1 of 2",
              type: "mcq",
              prompt: "What happens if you call print(coins) before assigning a value to coins?",
              options: [
                "It prints 0 automatically",
                "It prints an empty line",
                "It raises a NameError because coins has not been defined yet",
                "It creates coins with value 1"
              ],
              correctIndex: 2,
              hint: "Variables must be assigned before they can be read.",
              okMsg: "Correct! Referencing an undefined variable raises a NameError.",
              errMsg: "Incorrect. Reading a variable before defining it raises a NameError."
            },
            {
              id: "q30",
              lessonTag: "Lesson 15 (File 3 • Lesson 5) • Question 2 of 2",
              type: "input",
              prompt: "Start with coins = 10 and add 5. What final number is printed?",
              before: "coins = 10\ncoins = coins + 5\nprint(coins)  # Output: ",
              after: "",
              placeholder: "number",
              hint: "10 + 5 = 15.",
              okMsg: "Congratulations! You completed all 30 questions! Output is 15.",
              errMsg: "The correct number is 15.",
              accept: (v) => v.trim() === "15"
            }
          ]
        }
      }
    };

    const wrapper = document.getElementById("minpy-unit-wrapper");
    let currentLang = "ar";
    const questionStates = {};

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderReviewSection(sec) {
      const cardsHtml = sec.cards
        .map(
          (c) => `
          <div class="minpy-review-card">
            <div class="minpy-review-header">
              <span class="minpy-review-title">${escapeHtml(c.title)}</span>
              <span class="minpy-review-tag">${escapeHtml(c.tag)}</span>
            </div>
            <ul class="minpy-list">
              ${c.points.map((pt) => `<li>${escapeHtml(pt)}</li>`).join("")}
            </ul>
            ${c.code ? `<pre>${escapeHtml(c.code)}</pre>` : ""}
          </div>`
        )
        .join("");

      return `
        <section class="minpy-section" id="${escapeHtml(sec.id)}">
          <span class="minpy-kicker">${escapeHtml(sec.kicker)}</span>
          <h2 class="minpy-h2">${escapeHtml(sec.heading)}</h2>
          <p>${escapeHtml(sec.intro)}</p>
          ${cardsHtml}
        </section>
      `;
    }

    function renderCheatSheet(cs) {
      return `
        <section class="minpy-section" id="${escapeHtml(cs.id)}">
          <span class="minpy-kicker">${escapeHtml(cs.kicker)}</span>
          <h2 class="minpy-h2">${escapeHtml(cs.heading)}</h2>
          <div class="minpy-table-wrap">
            <table class="minpy-table">
              <thead>
                <tr>${cs.headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${cs.rows
                  .map(
                    (row) =>
                      `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
          <div class="minpy-summary">
            <span class="minpy-summary-title">${
              currentLang === "ar" ? "استعد للاختبار الحقيقي:" : "Ready for the Real Exam:"
            }</span>
            <p>${escapeHtml(cs.summary)}</p>
          </div>
        </section>
      `;
    }

    function renderExam(exam) {
      const total = exam.questions.length;
      const correctCount = Object.values(questionStates).filter((s) => s && s.isCorrect).length;
      const pct = Math.round((correctCount / total) * 100);

      const questionsHtml = exam.questions
        .map((q, idx) => {
          const st = questionStates[q.id] || {};
          const cardStateClass = st.checked
            ? st.isCorrect
              ? "answered-ok"
              : "answered-err"
            : "";

          const codeHtml = q.code ? `<pre>${escapeHtml(q.code)}</pre>` : "";

          let bodyHtml = "";
          if (q.type === "mcq") {
            bodyHtml = `
              <div class="minpy-options-list">
                ${q.options
                  .map((opt, optIdx) => {
                    const checkedAttr = st.selectedIdx === optIdx ? "checked" : "";
                    return `
                      <label class="minpy-option-label">
                        <input type="radio" name="radio-${escapeHtml(q.id)}" value="${optIdx}" ${checkedAttr} />
                        <span>${escapeHtml(opt)}</span>
                      </label>
                    `;
                  })
                  .join("")}
              </div>
            `;
          } else {
            const valAttr = st.inputVal ? escapeHtml(st.inputVal) : "";
            bodyHtml = `
              <div class="code-box">
                ${escapeHtml(q.before).replace(/\n/g, "<br>")}
                <input type="text" class="quiz-input" id="input-${escapeHtml(
                  q.id
                )}" placeholder="${escapeHtml(q.placeholder)}" value="${valAttr}" />
                ${escapeHtml(q.after).replace(/\n/g, "<br>")}
              </div>
            `;
          }

          let fbClass = "feedback";
          let fbText = "";
          if (st.feedbackType === "ok") {
            fbClass = "feedback ok";
            fbText = q.okMsg;
          } else if (st.feedbackType === "err") {
            fbClass = "feedback err";
            fbText = q.errMsg;
          } else if (st.feedbackType === "hint") {
            fbClass = "feedback hint";
            fbText = q.hint;
          }

          return `
            <div class="minpy-exam-card ${cardStateClass}" id="card-${escapeHtml(q.id)}">
              <div class="minpy-lab-header">
                <span class="minpy-lab-badge">Q${idx + 1} • ${escapeHtml(q.lessonTag)}</span>
                <span class="minpy-lab-score" id="status-${escapeHtml(q.id)}">${
            st.checked ? (st.isCorrect ? "✓ 1/1" : "✗ 0/1") : "0/1"
          }</span>
              </div>
              <p><strong>${escapeHtml(q.prompt)}</strong></p>
              ${codeHtml}
              ${bodyHtml}
              <div class="minpy-btn-row">
                <button type="button" class="run-btn" data-exam-check="${escapeHtml(q.id)}">${escapeHtml(
            exam.checkBtn
          )}</button>
                <button type="button" class="minpy-sec-btn" data-exam-hint="${escapeHtml(q.id)}">${escapeHtml(
            exam.hintBtn
          )}</button>
              </div>
              <div class="${fbClass}" id="fb-${escapeHtml(q.id)}">${escapeHtml(fbText)}</div>
            </div>
          `;
        })
        .join("");

      return `
        <section class="minpy-section" id="${escapeHtml(exam.id)}">
          <span class="minpy-kicker">${escapeHtml(exam.kicker)}</span>
          <h2 class="minpy-h2">${escapeHtml(exam.heading)}</h2>
          <p>${escapeHtml(exam.intro)}</p>

          <div class="minpy-progress-wrap">
            <strong>${escapeHtml(exam.progressLabel)} <span id="exam-score-text">${escapeHtml(
        exam.scoreLabel(correctCount, total)
      )}</span></strong>
            <div class="minpy-progress-track">
              <div class="minpy-progress-fill" id="exam-progress-fill" style="width:${pct}%"></div>
            </div>
            <button type="button" class="minpy-sec-btn" id="exam-reset-all">${escapeHtml(
              exam.resetAllBtn
            )}</button>
          </div>

          ${questionsHtml}

          <div class="minpy-btn-row" style="margin-top:24px;">
            <button type="button" class="run-btn" id="exam-show-report">${escapeHtml(
              exam.reportBtn
            )}</button>
          </div>

          <div class="minpy-final-report" id="exam-final-report">
            <h3 class="minpy-h3">${escapeHtml(exam.reportTitle)}</h3>
            <div class="minpy-final-grid">
              <div class="minpy-stat-box">
                <strong id="rep-correct">0 / 30</strong>
                <span>${escapeHtml(exam.statCorrect)}</span>
              </div>
              <div class="minpy-stat-box">
                <strong id="rep-solved">0 / 30</strong>
                <span>${escapeHtml(exam.statSolved)}</span>
              </div>
              <div class="minpy-stat-box">
                <strong id="rep-percent">0%</strong>
                <span>${escapeHtml(exam.statPercent)}</span>
              </div>
              <div class="minpy-stat-box">
                <strong id="rep-grade">-</strong>
                <span>${escapeHtml(exam.statGrade)}</span>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function renderAll() {
      if (!wrapper) return;
      const data = UNIT_FOUR_DATA[currentLang];
      wrapper.setAttribute("dir", data.dir);

      const roadmapHtml = data.roadmap
        .map(
          (r) =>
            `<div class="minpy-pill"><strong>${escapeHtml(r.step)}</strong><span>${escapeHtml(
              r.name
            )}</span></div>`
        )
        .join("");

      const tocHtml = data.toc
        .map(
          (t) =>
            `<a class="minpy-toc-link" href="${escapeHtml(t.href)}">${escapeHtml(t.label)}</a>`
        )
        .join("");

      const reviewsHtml = data.reviewSections.map(renderReviewSection).join("");
      const cheatHtml = renderCheatSheet(data.cheatSheet);
      const examHtml = renderExam(data.exam);

      wrapper.innerHTML = `
        <div class="minpy-top-bar">
          <span class="tag">${escapeHtml(data.badgeText)}</span>
          <button type="button" class="minpy-lang-btn" id="minpy-lang-toggle">${escapeHtml(
            data.langBtnText
          )}</button>
        </div>
        <div class="minpy-meta-info">${escapeHtml(data.metaText)}</div>
        <h1>${escapeHtml(data.title)}</h1>
        <div class="minpy-abstract">
          <strong class="welcome-banner">${escapeHtml(data.welcome)}</strong>
          ${escapeHtml(data.abstract)}
        </div>
        <div class="minpy-roadmap">${roadmapHtml}</div>
        <nav class="minpy-toc">
          <div class="minpy-toc-title">${escapeHtml(data.tocTitle)}</div>
          <div class="minpy-toc-grid">${tocHtml}</div>
        </nav>
        ${reviewsHtml}
        ${cheatHtml}
        ${examHtml}
      `;

      bindEvents();
    }

    function bindEvents() {
      const toggleBtn = document.getElementById("minpy-lang-toggle");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          currentLang = currentLang === "ar" ? "en" : "ar";
          renderAll();
        });
      }

      const data = UNIT_FOUR_DATA[currentLang];
      const exam = data.exam;
      const total = exam.questions.length;

      function refreshProgress() {
        const correctCount = Object.values(questionStates).filter(
          (s) => s && s.isCorrect
        ).length;
        const pct = Math.round((correctCount / total) * 100);
        const scoreEl = document.getElementById("exam-score-text");
        const fillEl = document.getElementById("exam-progress-fill");
        if (scoreEl) scoreEl.textContent = exam.scoreLabel(correctCount, total);
        if (fillEl) fillEl.style.width = `${pct}%`;
      }

      exam.questions.forEach((q) => {
        const checkBtn = wrapper.querySelector(`[data-exam-check="${q.id}"]`);
        const hintBtn = wrapper.querySelector(`[data-exam-hint="${q.id}"]`);
        const fbEl = document.getElementById(`fb-${q.id}`);
        const cardEl = document.getElementById(`card-${q.id}`);
        const statusEl = document.getElementById(`status-${q.id}`);

        if (checkBtn && fbEl) {
          checkBtn.addEventListener("click", () => {
            let isCorrect = false;
            const prev = questionStates[q.id] || {};

            if (q.type === "mcq") {
              const selectedRadio = wrapper.querySelector(
                `input[name="radio-${q.id}"]:checked`
              );
              const selectedIdx = selectedRadio ? parseInt(selectedRadio.value, 10) : -1;
              prev.selectedIdx = selectedIdx;
              isCorrect = selectedIdx === q.correctIndex;
            } else {
              const inp = document.getElementById(`input-${q.id}`);
              const val = inp ? inp.value : "";
              prev.inputVal = val;
              isCorrect = q.accept(val);
            }

            prev.checked = true;
            prev.isCorrect = isCorrect;
            prev.feedbackType = isCorrect ? "ok" : "err";
            questionStates[q.id] = prev;

            fbEl.className = isCorrect ? "feedback ok" : "feedback err";
            fbEl.textContent = isCorrect ? q.okMsg : q.errMsg;

            if (cardEl) {
              cardEl.classList.remove("answered-ok", "answered-err");
              cardEl.classList.add(isCorrect ? "answered-ok" : "answered-err");
            }
            if (statusEl) {
              statusEl.textContent = isCorrect ? "✓ 1/1" : "✗ 0/1";
            }

            refreshProgress();
          });
        }

        if (hintBtn && fbEl) {
          hintBtn.addEventListener("click", () => {
            const prev = questionStates[q.id] || {};
            prev.feedbackType = "hint";
            questionStates[q.id] = prev;
            fbEl.className = "feedback hint";
            fbEl.textContent = q.hint;
          });
        }
      });

      const reportBtn = document.getElementById("exam-show-report");
      const reportBox = document.getElementById("exam-final-report");
      if (reportBtn && reportBox) {
        reportBtn.addEventListener("click", () => {
          const states = Object.values(questionStates);
          const correctCount = states.filter((s) => s && s.isCorrect).length;
          const attemptedCount = states.filter((s) => s && s.checked).length;
          const pct = Math.round((correctCount / total) * 100);

          let gradeText = exam.grades.retry;
          if (pct >= 90) gradeText = exam.grades.excellent;
          else if (pct >= 75) gradeText = exam.grades.veryGood;
          else if (pct >= 60) gradeText = exam.grades.pass;

          document.getElementById("rep-correct").textContent = `${correctCount} / ${total}`;
          document.getElementById("rep-solved").textContent = `${attemptedCount} / ${total}`;
          document.getElementById("rep-percent").textContent = `${pct}%`;
          document.getElementById("rep-grade").textContent = gradeText;

          reportBox.classList.add("visible");
          reportBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      }

      const resetBtn = document.getElementById("exam-reset-all");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          Object.keys(questionStates).forEach((k) => delete questionStates[k]);
          renderAll();
        });
      }
    }

    renderAll();
  })();
</script>
