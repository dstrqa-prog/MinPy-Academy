            heading: "Lesson 3: Third Core Block — Redstone Math, Logic & Input (//, %, and/or/not, input(), f-strings)",

          },
          {

            intro: [
              "Lists store ordered sequences, dictionaries map keys to values, and functions (def) package reusable logic with parameters and return values."
            ],
            analogy: {

              lines: [
                "A list is like an ordered hotbar where items sit at 0-based positions and can be appended.",
                "A dictionary maps each item name to its count, like \"iron\": 18.",
                "A function defined with def is like a reusable blueprint you call whenever you need that calculation."
              ]
            },
            subsections: [
              {

                paragraphs: [

                ],

                output: "First item: Pickaxe\nTotal items: 4\nSlot 0: Pickaxe\nSlot 1: Torch\nSlot 2: Ladder\nSlot 3: Bucket"
              },
              {
                title: "5.2 Dictionaries: Key-Value Pairs",
                paragraphs: [
                  "Dictionaries store key: value pairs inside {} for direct lookup by key."
                ],
                code: "chest_items = {\n    \"iron\": 18,\n    \"coal\": 32,\n    \"emerald\": 5\n}\nchest_items[\"emerald\"] += 3\nprint(\"Emeralds now:\", chest_items[\"emerald\"])\nfor resource, qty in chest_items.items():\n    print(f\"{resource}: {qty}\")",
                output: "Emeralds now: 8\niron: 18\ncoal: 32\nemerald: 8"
              },
              {
                title: "5.3 Functions: def and return",
                paragraphs: [
                  "Define reusable functions with def name(params): and return results back to the caller."
                ],
                code: "def blocks_for_wall(length, height):\n    return length * height\n\nwall_a = blocks_for_wall(6, 3)\nwall_b = blocks_for_wall(10, 4)\nprint(\"Wall A blocks:\", wall_a)\nprint(\"Wall B blocks:\", wall_b)\nprint(\"Combined total:\", wall_a + wall_b)",
                output: "Wall A blocks: 18\nWall B blocks: 40\nCombined total: 58"
              }
            ],
            mistake: {
              title: "Common Mistakes in Basic 5:",
              text: "1) Indexing past the end of a list (IndexError). 2) Reading a missing dictionary key without checking or using .get() (KeyError). 3) Forgetting return when a function needs to send a value back."
            },
            summary: "Basic 5 complete: lists hold ordered items, dictionaries map keys to values, and functions encapsulate reusable logic."
          }
        ],
        labSection: {
          kicker: "Interactive Lab • 6 Minecraft-Logic Challenges",
          heading: "Comprehensive Lab: Test Your 5 Core Basics",
          desc: "Complete each Minecraft-logic challenge and click Check for instant validation or Hint for guidance.",
          scoreLabel: (done, total) => `Completed Challenges: ${done} / ${total}`,
          checkBtn: "Check",
          hintBtn: "Hint",
          resetBtn: "Reset All",
          challenges: [
            {
              id: "ch1",
              badge: "Challenge 1 • Basic 1 (Output & Signs)",
              prompt: "Complete the print call to display \"Redstone Ready\":",
              before: "print(",
              after: ")",
              placeholder: "Quoted string",
              hint: "Wrap \"Redstone Ready\" in quotation marks.",
              okMsg: "Great! \"Redstone Ready\" is printed cleanly.",
              errMsg: "Write \"Redstone Ready\" inside quotation marks.",
              accept: (v) => v.replace(/\s+/g, " ").trim() === '"Redstone Ready"' || v.replace(/\s+/g, " ").trim() === "'Redstone Ready'"
            },
            {
              id: "ch2",
              badge: "Challenge 2 • Basic 2 (Storage Chests)",
              prompt: "Store 64 in a variable named stack_size:",
              before: "",

              accept: (v) => /^stack_size\s*=\s*64$/.test(v.trim())
            },
            {
              id: "ch3",
              badge: "Challenge 3 • Basic 3 (Modulo & Logic)",
              prompt: "Write the modulo expression for 25 blocks divided into groups of 6:",
              before: "leftover = ",
              after: "",
              placeholder: "e.g. 10 % 3",
              hint: "Use % between 25 and 6.",
              okMsg: "Correct! 25 % 6 equals 1.",
              errMsg: "Write 25 % 6.",
              accept: (v) => /^25\s*%\s*6$/.test(v.trim())
            },
            {
              id: "ch4",
              badge: "Challenge 4 • Basic 4 (Conditional Gates)",
              prompt: "Complete the if condition when power is greater than or equal to 10:",
              before: "if ",
              after: ":\n    print(\"Door Open\")",
              placeholder: "power >= 10",
              hint: "Write power >= 10",
              okMsg: "Well done! power >= 10 opens the door.",
              errMsg: "Write power >= 10.",
              accept: (v) => /^power\s*>=\s*10$/.test(v.trim())
            },
            {
              id: "ch5",
              badge: "Challenge 5 • Basic 4 (Loops)",
              prompt: "Complete range() to loop 5 times (0 through 4):",
              before: "for i in range(",
              after: "):\n    print(i)",
              placeholder: "5",
              hint: "Put 5 inside range().",
              okMsg: "Spot on! range(5) runs 5 iterations.",
              errMsg: "Enter 5 inside range().",
              accept: (v) => v.trim() === "5"
            },
            {
              id: "ch6",
              badge: "Challenge 6 • Basic 5 (Functions)",
              prompt: "Complete the return line to return length multiplied by width:",
              before: "def area(length, width):\n    ",
              after: "",
              placeholder: "return length * width",
              hint: "Write return length * width",
              okMsg: "Great! The function returns length * width.",
              errMsg: "Write return length * width.",
              accept: (v) => /^return\s+length\s*\*\s*width$/.test(v.trim())
            }
          ]
        }
      }
    };

    const wrapper = document.getElementById("minpy-unit-wrapper");
    let currentLang = "ar";
    const completedSet = new Set();

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderLesson(lesson) {
      const subsHtml = lesson.subsections
        .map((sub) => {
          const bulletsHtml = sub.bullets
            ? `<ul class="minpy-list">${sub.bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`
            : "";

          const tableHtml = sub.table
            ? `<div class="minpy-table-wrap"><table class="minpy-table"><thead><tr>${sub.table.headers
                .map((h) => `<th>${escapeHtml(h)}</th>`)
                .join("")}</tr></thead><tbody>${sub.table.rows
                .map((r) => `<tr>${r.map((c) => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`)
                .join("")}</tbody></table></div>`
            : "";

          const codeHtml = sub.code ? `<pre>${escapeHtml(sub.code)}</pre>` : "";
          const outputHtml = sub.output
            ? `<div class="minpy-output"><span class="minpy-output-label">OUTPUT</span>${escapeHtml(
                sub.output
              ).replace(/\n/g, "<br>")}</div>`
            : "";

          const traceHtml = sub.trace
            ? `<div class="minpy-trace"><span class="minpy-trace-title">TRACE</span>${sub.trace
                .map((t) => `<div class="minpy-trace-step">${escapeHtml(t)}</div>`)
                .join("")}</div>`
            : "";

          return `
            <h3 class="minpy-h3">${escapeHtml(sub.title)}</h3>
            ${sub.paragraphs.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}
            ${bulletsHtml}
            ${tableHtml}
            ${codeHtml}
            ${outputHtml}
            ${traceHtml}
          `;
        })
        .join("");

      return `
        <section class="minpy-section" id="${escapeHtml(lesson.id)}">
          <span class="minpy-kicker">${escapeHtml(lesson.kicker)}</span>
          <h2 class="minpy-h2">${escapeHtml(lesson.heading)}</h2>
          ${lesson.intro.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}
          <div class="minpy-analogy">
            <span class="minpy-analogy-title">${escapeHtml(lesson.analogy.title)}</span>
            ${lesson.analogy.lines.map((l) => `<p>${escapeHtml(l)}</p>`).join("")}
          </div>
          ${subsHtml}
          <div class="minpy-mistake">
            <span class="minpy-mistake-title">${escapeHtml(lesson.mistake.title)}</span>
            <p>${escapeHtml(lesson.mistake.text)}</p>
          </div>
          <div class="minpy-summary">
            <span class="minpy-summary-title">SUMMARY</span>
            <p>${escapeHtml(lesson.summary)}</p>
          </div>
        </section>
      `;
    }

    function renderLab(lab) {
      const total = lab.challenges.length;
      const done = completedSet.size;
      const pct = Math.round((done / total) * 100);

      const cardsHtml = lab.challenges
        .map((ch) => {
          const isDone = completedSet.has(ch.id);
          return `
            <div class="minpy-lab-card" id="card-${escapeHtml(ch.id)}">
              <div class="minpy-lab-header">
                <span class="minpy-lab-badge">${escapeHtml(ch.badge)}</span>
                <span class="minpy-lab-score">${isDone ? "✓" : "•"}</span>
              </div>
              <p>${escapeHtml(ch.prompt)}</p>
              <div class="code-box">
                ${escapeHtml(ch.before).replace(/\n/g, "<br>")}
                <input type="text" class="quiz-input" id="input-${escapeHtml(
                  ch.id
                )}" placeholder="${escapeHtml(ch.placeholder)}" size="26" />
                ${escapeHtml(ch.after).replace(/\n/g, "<br>")}
              </div>
              <div class="minpy-btn-row">
                <button type="button" class="run-btn" data-check="${escapeHtml(ch.id)}">${escapeHtml(
            lab.checkBtn
          )}</button>
                <button type="button" class="minpy-sec-btn" data-hint="${escapeHtml(ch.id)}">${escapeHtml(
            lab.hintBtn
          )}</button>
              </div>
              <div class="feedback" id="fb-${escapeHtml(ch.id)}"></div>
            </div>
          `;
        })
        .join("");

      return `
        <section class="minpy-section" id="lab-section">
          <span class="minpy-kicker">${escapeHtml(lab.kicker)}</span>
          <h2 class="minpy-h2">${escapeHtml(lab.heading)}</h2>
          <p>${escapeHtml(lab.desc)}</p>
          <div class="minpy-progress-wrap">
            <span class="minpy-lab-score" id="minpy-score-text">${escapeHtml(lab.scoreLabel(done, total))}</span>
            <div class="minpy-progress-track">
              <div class="minpy-progress-fill" id="minpy-progress-fill" style="width:${pct}%"></div>
            </div>
            <button type="button" class="minpy-sec-btn" id="minpy-reset-all">${escapeHtml(lab.resetBtn)}</button>
          </div>
          ${cardsHtml}
        </section>
      `;
    }

    function render() {
      const data = LECTURE_CONTENT[currentLang];
      wrapper.setAttribute("dir", data.dir);

      const roadmapHtml = data.roadmap
        .map((r) => `<div class="minpy-pill"><strong>${escapeHtml(r.step)}</strong><span>${escapeHtml(r.name)}</span></div>`)
        .join("");

      const tocHtml = data.toc
        .map((t) => `<a class="minpy-toc-link" href="${escapeHtml(t.href)}">${escapeHtml(t.label)}</a>`)
        .join("");

      const lessonsHtml = data.lessons.map(renderLesson).join("");
      const labHtml = renderLab(data.labSection);

      wrapper.innerHTML = `
        <div class="minpy-top-bar">
          <span class="tag">${escapeHtml(data.badgeText)}</span>
          <span class="minpy-meta-info">${escapeHtml(data.metaText)}</span>
          <button type="button" class="minpy-lang-btn" id="minpy-lang-toggle">${escapeHtml(data.langBtnText)}</button>
        </div>
        <h1>${escapeHtml(data.title)}</h1>
        <div class="minpy-abstract">
          <strong class="welcome-banner">${escapeHtml(data.welcome)}</strong>
          ${escapeHtml(data.abstract)}
        </div>
        <div class="minpy-roadmap">${roadmapHtml}</div>
        <div class="minpy-toc">
          <div class="minpy-toc-title">${escapeHtml(data.tocTitle)}</div>
          <div class="minpy-toc-grid">${tocHtml}</div>
        </div>
        ${lessonsHtml}
        ${labHtml}
      `;

      bindEvents();
    }

    function bindEvents() {
      const toggleBtn = document.getElementById("minpy-lang-toggle");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          currentLang = currentLang === "ar" ? "en" : "ar";
          render();
        });
      }

      const data = LECTURE_CONTENT[currentLang];
      const total = data.labSection.challenges.length;

      data.labSection.challenges.forEach((ch) => {
        const checkBtn = wrapper.querySelector(`[data-check="${ch.id}"]`);
        const hintBtn = wrapper.querySelector(`[data-hint="${ch.id}"]`);
        const inputEl = document.getElementById(`input-${ch.id}`);
        const fbEl = document.getElementById(`fb-${ch.id}`);

        if (checkBtn && inputEl && fbEl) {
          checkBtn.addEventListener("click", () => {
            const val = inputEl.value;
            if (ch.accept(val)) {
              completedSet.add(ch.id);
              fbEl.className = "feedback ok";
              fbEl.textContent = ch.okMsg;
              updateProgress();
            } else {
              fbEl.className = "feedback err";
              fbEl.textContent = ch.errMsg;
            }
          });
        }

        if (hintBtn && fbEl) {
          hintBtn.addEventListener("click", () => {
            fbEl.className = "feedback hint";
            fbEl.textContent = ch.hint;
          });
        }
      });

      const resetBtn = document.getElementById("minpy-reset-all");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          completedSet.clear();
          data.labSection.challenges.forEach((ch) => {
            const inp = document.getElementById(`input-${ch.id}`);
            const fb = document.getElementById(`fb-${ch.id}`);
            if (inp) inp.value = "";
            if (fb) {
              fb.className = "feedback";
              fb.textContent = "";
            }
          });
          updateProgress();
        });
      }

      function updateProgress() {
        const done = completedSet.size;
        const pct = Math.round((done / total) * 100);
        const scoreEl = document.getElementById("minpy-score-text");
        const fillEl = document.getElementById("minpy-progress-fill");
        if (scoreEl) scoreEl.textContent = data.labSection.scoreLabel(done, total);
        if (fillEl) fillEl.style.width = `${pct}%`;

        data.labSection.challenges.forEach((ch) => {
          const card = document.getElementById(`card-${ch.id}`);
          const badge = card ? card.querySelector(".minpy-lab-score") : null;
          if (badge) badge.textContent = completedSet.has(ch.id) ? "✓" : "•";
        });
      }
    }

    render();
  })();
</script>
