<style>
  /* ============ المتغيرات الأساسية (كانت مفقودة) ============ */
  .minpy-deep-unit {
    --surface-soft: #f8fafc;
    --surface-tint: #eef2ff;
    --border-strong: #cbd5e1;
    --accent-soft: rgba(37, 99, 235, 0.12);
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --warn-border: #fcd34d;
    --analogy-bg: #f0f9ff;
    --analogy-border: #7dd3fc;
    --analogy-title: #0369a1;
    --step-bg: #faf5ff;
    --step-border: #d8b4fe;
    --step-title: #6b21a8;
    --radius-sm: 6px;
    --radius-md: 8px;

    --navy-hover: #334155;
    --border: #e2e8f0;
    --paper: #ffffff;
    --heading: #0f172a;
    --subtext: #334155;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #2563eb;
    --error: #dc2626;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --success: #15803d;
    --success-bg: #f0fdf4;
    --success-border: #bbf7d0;
    --inline-code-bg: #f1f5f9;
    line-height: 1.95;
  }

  [data-theme="dark"] .minpy-deep-unit {
    --surface-soft: #172033;
    --surface-tint: rgba(96, 165, 250, 0.12);
    --border-strong: #475569;
    --accent-soft: rgba(96, 165, 250, 0.16);
    --warn: #fbbf24;
    --warn-bg: rgba(180, 83, 9, 0.22);
    --warn-border: #92400e;
    --analogy-bg: rgba(3, 105, 161, 0.18);
    --analogy-border: #0284c7;
    --analogy-title: #38bdf8;
    --step-bg: rgba(107, 33, 168, 0.18);
    --step-border: #7e22ce;
    --step-title: #c084fc;
    --navy: #0f172a;
    --navy-hover: #1e293b;
    --border: #1e293b;
    --paper: #0b1220;
    --heading: #e2e8f0;
    --subtext: #cbd5e1;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --error: #f87171;
    --error-bg: rgba(220, 38, 38, 0.12);
    --error-border: #7f1d1d;
    --success: #4ade80;
    --success-bg: rgba(21, 128, 61, 0.15);
    --success-border: #14532d;
    --inline-code-bg: #1e293b;
  }

  /* ============ كلاسات عامة كانت مفقودة ============ */
  .minpy-deep-unit .tag {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 700;
  }

  .minpy-deep-unit .run-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .minpy-deep-unit .run-btn:hover { opacity: 0.9; }

  .minpy-deep-unit .code-box {
    background: var(--inline-code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    direction: ltr;
    text-align: left;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 0.9rem;
    color: var(--heading);
    margin: 12px 0;
    line-height: 2.1;
  }

  .minpy-deep-unit .quiz-input {
    background: var(--paper);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 0.9rem;
    color: var(--heading);
    text-align: center;
  }
  .minpy-deep-unit .quiz-input:focus { outline: 2px solid var(--accent); }

  .minpy-deep-unit .feedback {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 0.92rem;
    font-weight: 700;
  }
  .minpy-deep-unit .feedback.ok {
    display: block;
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    color: var(--success);
  }
  .minpy-deep-unit .feedback.err {
    display: block;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error);
  }

  .minpy-deep-unit pre {
    background: var(--inline-code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    direction: ltr;
    text-align: left;
    overflow-x: auto;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 0.9rem;
    color: var(--heading);
    margin: 12px 0;
  }

  .minpy-deep-unit h1 {
    font-size: 1.9rem;
    color: var(--heading);
    margin: 16px 0;
    line-height: 1.35;
  }

  .minpy-deep-unit p {
    color: var(--subtext);
    margin: 10px 0;
  }

  .minpy-deep-unit .minpy-abstract {
    white-space: pre-line; /* لعرض أسطر الـ abstract بشكل صحيح */
  }

  /* ============ بقية الستايل الأصلي كما هو ============ */
  .minpy-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }

  .minpy-lang-btn {
    background: var(--navy);
    color: #ffffff;
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 0.86rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .minpy-lang-btn:hover { background: var(--navy-hover); }

  .minpy-meta-info {
    font-size: 0.88rem;
    color: var(--muted);
    font-weight: 600;
  }

  .minpy-abstract {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-inline-start: 4px solid var(--navy);
    padding: 18px 22px;
    border-radius: var(--radius-sm);
    margin-bottom: 24px;
    color: var(--subtext);
    font-size: 1.05rem;
  }

  .minpy-abstract strong.welcome-banner {
    display: block;
    color: var(--accent);
    font-size: 1.15rem;
    margin-bottom: 6px;
  }

  .minpy-roadmap {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 10px;
    margin-bottom: 26px;
  }

  .minpy-pill {
    background: var(--surface-tint);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    text-align: center;
  }
  .minpy-pill strong { display: block; color: var(--accent); font-size: 0.84rem; }
  .minpy-pill span { font-size: 0.88rem; color: var(--heading); font-weight: 700; }

  .minpy-toc {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px 22px;
    margin-bottom: 32px;
  }
  .minpy-toc-title {
    font-size: 1rem;
    font-weight: 800;
    color: var(--heading);
    margin-bottom: 12px;
  }
  .minpy-toc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 10px;
  }
  .minpy-toc-link {
    display: block;
    text-decoration: none;
    color: var(--accent);
    background: var(--paper);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 0.91rem;
    font-weight: 700;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .minpy-toc-link:hover { border-color: var(--accent); background: var(--surface-tint); }

  .minpy-section {
    margin-top: 44px;
    padding-top: 28px;
    border-top: 2px solid var(--border);
  }

  .minpy-kicker {
    display: inline-block;
    background: var(--navy);
    color: #ffffff;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 8px;
  }

  .minpy-h2 {
    font-size: 1.45rem !important;
    color: var(--heading);
    font-weight: 800;
    margin: 6px 0 16px !important;
    line-height: 1.45;
  }

  .minpy-h3 {
    font-size: 1.15rem;
    color: var(--navy);
    font-weight: 800;
    margin: 24px 0 10px;
    padding-inline-start: 10px;
    border-inline-start: 3px solid var(--accent);
  }
  [data-theme="dark"] .minpy-h3 { color: var(--accent); }

  .minpy-list {
    margin: 12px 0 18px 0;
    padding-inline-start: 24px;
    color: var(--subtext);
  }
  .minpy-list li { margin-bottom: 10px; font-size: 1.03rem; }

  .minpy-analogy {
    background: var(--analogy-bg);
    border: 1px solid var(--analogy-border);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    margin: 18px 0;
  }
  .minpy-analogy-title {
    font-weight: 800;
    color: var(--analogy-title);
    font-size: 1rem;
    margin-bottom: 8px;
    display: block;
  }
  .minpy-analogy p { color: var(--text) !important; font-size: 1.02rem !important; margin-bottom: 8px !important; }
  .minpy-analogy p:last-child { margin-bottom: 0 !important; }

  .minpy-trace {
    background: var(--step-bg);
    border: 1px solid var(--step-border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin: 16px 0 22px;
  }
  .minpy-trace-title {
    font-weight: 800;
    color: var(--step-title);
    font-size: 0.96rem;
    margin-bottom: 10px;
    display: block;
  }
  .minpy-trace-step {
    padding: 8px 12px;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    font-size: 0.96rem;
    color: var(--subtext);
  }
  .minpy-trace-step:last-child { margin-bottom: 0; }

  .minpy-mistake {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin: 20px 0;
    color: var(--text);
  }
  .minpy-mistake-title {
    font-weight: 800;
    color: var(--error);
    display: block;
    margin-bottom: 6px;
    font-size: 0.98rem;
  }
  .minpy-mistake p { color: var(--text) !important; margin-bottom: 0 !important; }

  .minpy-output {
    background: var(--surface-soft);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin: -8px 0 18px;
    direction: ltr;
    text-align: left;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .minpy-output-label {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .minpy-table-wrap {
    overflow-x: auto;
    margin: 18px 0 22px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  table.minpy-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  table.minpy-table th {
    background: var(--navy);
    color: #ffffff;
    padding: 11px 14px;
    text-align: start;
    font-weight: 700;
  }
  table.minpy-table td {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    color: var(--subtext);
    vertical-align: top;
  }
  table.minpy-table tr:nth-child(even) td { background: var(--surface-soft); }

  .minpy-summary {
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-top: 22px;
  }
  .minpy-summary-title {
    font-weight: 800;
    color: var(--success);
    display: block;
    margin-bottom: 6px;
    font-size: 1rem;
  }
  .minpy-summary p { color: var(--text) !important; margin-bottom: 0 !important; }

  .minpy-lab-card {
    background: var(--surface-soft);
    border: 1px solid var(--border-strong);
    border-top: 4px solid var(--navy);
    border-radius: var(--radius-md);
    padding: 22px 24px;
    margin: 20px 0;
  }
  .minpy-lab-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .minpy-lab-badge {
    background: var(--navy);
    color: #ffffff;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 0.82rem;
    font-weight: 700;
  }
  .minpy-lab-score { font-size: 0.92rem; font-weight: 700; color: var(--accent); }

  .minpy-btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .minpy-sec-btn {
    background: var(--paper);
    color: var(--heading);
    border: 1px solid var(--border-strong);
    padding: 9px 16px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.9rem;
    margin-top: 12px;
  }
  .minpy-sec-btn:hover { border-color: var(--accent); }

  .feedback.hint {
    display: block;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn);
  }

  .minpy-progress-wrap {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .minpy-progress-track {
    flex: 1;
    min-width: 180px;
    height: 12px;
    background: var(--inline-code-bg);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .minpy-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
</style>

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

      const tocHtml = data.toc
        .map((item) => `<a class="minpy-toc-link" href="${item.href}">${escapeHtml(item.label)}</a>`)
        .join("");

      const lessonsHtml = data.lessons
        .map((lesson) => {
          const introHtml = lesson.intro
            .map((p) => `<p>${escapeHtml(p)}</p>`)
            .join("");

          const analogyHtml = lesson.analogy
            ? `<div class="minpy-analogy">
                <span class="minpy-analogy-title">${escapeHtml(lesson.analogy.title)}</span>
                ${lesson.analogy.lines.map((l) => `<p>${escapeHtml(l)}</p>`).join("")}
              </div>`
            : "";

          const subsHtml = lesson.subsections
            .map((sub) => {
              const subParas = (sub.paragraphs || [])
                .map((p) => `<p>${escapeHtml(p)}</p>`)
                .join("");

              const bulletsHtml = sub.bullets
                ? `<ul class="minpy-list">
                    ${sub.bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join("")}
                  </ul>`
                : "";

              const tableHtml = sub.table
                ? `<div class="minpy-table-wrap">
                    <table class="minpy-table">
                      <thead>
                        <tr>${sub.table.headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
                      </thead>
                      <tbody>
                        ${sub.table.rows
                          .map(
                            (row) =>
                              `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`
                          )
                          .join("")}
                      </tbody>
                    </table>
                  </div>`
                : "";

              const codeHtml = sub.code
                ? `<pre>${escapeHtml(sub.code)}</pre>`
                : "";

              const outLabel = currentLang === "ar" ? "المخرجات على الشاشة (Output):" : "Console Output:";
              const outputHtml = sub.output
                ? `<div class="minpy-output"><span class="minpy-output-label">${outLabel}</span>${escapeHtml(
                    sub.output
                  ).replace(/\n/g, "<br>")}</div>`
                : "";

              const traceTitle =
                currentLang === "ar"
                  ? "تتبّع تنفيذ الكود سطراً بسطر (ماذا فعل الحاسوب؟):"
                  : "Line-by-Line Execution Trace (What Did the Computer Do?):";
              const traceHtml = sub.trace
                ? `<div class="minpy-trace">
                    <span class="minpy-trace-title">${traceTitle}</span>
                    ${sub.trace
                      .map((step) => `<div class="minpy-trace-step">${escapeHtml(step)}</div>`)
                      .join("")}
                  </div>`
                : "";

              return `
                <h3 class="minpy-h3">${escapeHtml(sub.title)}</h3>
                ${subParas}
                ${bulletsHtml}
                ${tableHtml}
                ${codeHtml}
                ${outputHtml}
                ${traceHtml}
              `;
            })
            .join("");

          const mistakeHtml = lesson.mistake
            ? `<div class="minpy-mistake">
                <span class="minpy-mistake-title">${escapeHtml(lesson.mistake.title)}</span>
                <p>${escapeHtml(lesson.mistake.text)}</p>
              </div>`
            : "";

          const summaryHtml = lesson.summary
            ? `<div class="minpy-summary">
                <span class="minpy-summary-title">${
                  currentLang === "ar" ? "الخلاصة الذهبية للدرس:" : "Key Takeaway:"
                }</span>
                <p>${escapeHtml(lesson.summary)}</p>
              </div>`
            : "";

          return `
            <section class="minpy-section" id="${lesson.id}">
              <span class="minpy-kicker">${escapeHtml(lesson.kicker)}</span>
              <h2 class="minpy-h2">${escapeHtml(lesson.heading)}</h2>
              ${introHtml}
              ${analogyHtml}
              ${subsHtml}
              ${mistakeHtml}
              ${summaryHtml}
            </section>
          `;
        })
        .join("");

      const lab = data.lab;
      const labHtml = `
        <section class="minpy-section" id="${lab.id}">
          <span class="minpy-kicker">${currentLang === "ar" ? "التطبيق العملي" : "Hands-On Practice"}</span>
          <h2 class="minpy-h2">${escapeHtml(lab.heading)}</h2>
          <p>${escapeHtml(lab.intro)}</p>

          <div class="minpy-progress-wrap">
            <strong>${escapeHtml(lab.progressLabel)} <span id="lab-progress-text">0 / 6</span></strong>
            <div class="minpy-progress-track">
              <div class="minpy-progress-fill" id="lab-progress-fill"></div>
            </div>
            <span class="minpy-lab-score" id="lab-total-points">0 / 100 ${escapeHtml(lab.scoreUnit)}</span>
          </div>

          <div class="minpy-lab-card">
            <div class="minpy-lab-header">
              <span class="minpy-lab-badge">${escapeHtml(lab.c1.badge)}</span>
              <span class="minpy-lab-score">${escapeHtml(lab.c1.score)}</span>
            </div>
            <h3 class="minpy-h3">${escapeHtml(lab.c1.title)}</h3>
            <p>${escapeHtml(lab.c1.desc)}</p>
            <div class="code-box">
              <input type="text" id="q1_fn" class="quiz-input" style="width:105px;" placeholder="function" />("2026", "11", "25", sep="<input type='text' id='q1_sep' class='quiz-input' style='width:55px;' placeholder='?' />")<br>
              <span># Expected Output: 2026-11-25</span>
            </div>
            <div class="minpy-btn-row">
              <button type="button" class="run-btn" onclick="minpyCheckC1()">${escapeHtml(lab.checkBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyShowHint(1)">${escapeHtml(lab.hintBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyResetChallenge(1, ['q1_fn', 'q1_sep'])">${escapeHtml(lab.resetBtn)}</button>
            </div>
            <div id="fb-1" class="feedback"></div>
          </div>

          <div class="minpy-lab-card">
            <div class="minpy-lab-header">
              <span class="minpy-lab-badge">${escapeHtml(lab.c2.badge)}</span>
              <span class="minpy-lab-score">${escapeHtml(lab.c2.score)}</span>
            </div>
            <h3 class="minpy-h3">${escapeHtml(lab.c2.title)}</h3>
            <p>${escapeHtml(lab.c2.desc)}</p>
            <div class="code-box">
              items_str = "12"<br>
              total = <input type="text" id="q2_cast" class="quiz-input" style="width:85px;" placeholder="type" />(items_str) + 8<br>
              print(total)  <span># Expected Output: 20</span>
            </div>
            <div class="minpy-btn-row">
              <button type="button" class="run-btn" onclick="minpyCheckC2()">${escapeHtml(lab.checkBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyShowHint(2)">${escapeHtml(lab.hintBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyResetChallenge(2, ['q2_cast'])">${escapeHtml(lab.resetBtn)}</button>
            </div>
            <div id="fb-2" class="feedback"></div>
          </div>

          <div class="minpy-lab-card">
            <div class="minpy-lab-header">
              <span class="minpy-lab-badge">${escapeHtml(lab.c3.badge)}</span>
              <span class="minpy-lab-score">${escapeHtml(lab.c3.score)}</span>
            </div>
            <h3 class="minpy-h3">${escapeHtml(lab.c3.title)}</h3>
            <p>${escapeHtml(lab.c3.desc)}</p>
            <div class="code-box">
              lang = "Python"<br>
              first_letter = lang[<input type="text" id="q3_idx" class="quiz-input" style="width:70px;" placeholder="index" />]<br>
              print(first_letter)  <span># Expected Output: P</span>
            </div>
            <div class="minpy-btn-row">
              <button type="button" class="run-btn" onclick="minpyCheckC3()">${escapeHtml(lab.checkBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyShowHint(3)">${escapeHtml(lab.hintBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyResetChallenge(3, ['q3_idx'])">${escapeHtml(lab.resetBtn)}</button>
            </div>
            <div id="fb-3" class="feedback"></div>
          </div>

          <div class="minpy-lab-card">
            <div class="minpy-lab-header">
              <span class="minpy-lab-badge">${escapeHtml(lab.c4.badge)}</span>
              <span class="minpy-lab-score">${escapeHtml(lab.c4.score)}</span>
            </div>
            <h3 class="minpy-h3">${escapeHtml(lab.c4.title)}</h3>
            <p>${escapeHtml(lab.c4.desc)}</p>
            <div class="code-box">
              candies = 14<br>
              kids = 4<br>
              remainder = candies <input type="text" id="q4_op" class="quiz-input" style="width:70px;" placeholder="op" /> kids<br>
              print(remainder)  <span># Expected Output: 2</span>
            </div>
            <div class="minpy-btn-row">
              <button type="button" class="run-btn" onclick="minpyCheckC4()">${escapeHtml(lab.checkBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyShowHint(4)">${escapeHtml(lab.hintBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyResetChallenge(4, ['q4_op'])">${escapeHtml(lab.resetBtn)}</button>
            </div>
            <div id="fb-4" class="feedback"></div>
          </div>

          <div class="minpy-lab-card">
            <div class="minpy-lab-header">
              <span class="minpy-lab-badge">${escapeHtml(lab.c5.badge)}</span>
              <span class="minpy-lab-score">${escapeHtml(lab.c5.score)}</span>
            </div>
            <h3 class="minpy-h3">${escapeHtml(lab.c5.title)}</h3>
            <p>${escapeHtml(lab.c5.desc)}</p>
            <div class="code-box">
              mark = 75<br>
              <input type="text" id="q5_if" class="quiz-input" style="width:85px;" placeholder="keyword" /> mark &gt;= 60:<br>
              &nbsp;&nbsp;&nbsp;&nbsp;print("Passed")<br>
              <input type="text" id="q5_else" class="quiz-input" style="width:85px;" placeholder="keyword" />:<br>
              &nbsp;&nbsp;&nbsp;&nbsp;print("Try again")
            </div>
            <div class="minpy-btn-row">
              <button type="button" class="run-btn" onclick="minpyCheckC5()">${escapeHtml(lab.checkBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyShowHint(5)">${escapeHtml(lab.hintBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyResetChallenge(5, ['q5_if', 'q5_else'])">${escapeHtml(lab.resetBtn)}</button>
            </div>
            <div id="fb-5" class="feedback"></div>
          </div>

          <div class="minpy-lab-card">
            <div class="minpy-lab-header">
              <span class="minpy-lab-badge">${escapeHtml(lab.c6.badge)}</span>
              <span class="minpy-lab-score">${escapeHtml(lab.c6.score)}</span>
            </div>
            <h3 class="minpy-h3">${escapeHtml(lab.c6.title)}</h3>
            <p>${escapeHtml(lab.c6.desc)}</p>
            <div class="code-box">
              <input type="text" id="q6_def" class="quiz-input" style="width:85px;" placeholder="keyword" /> multiply(a, b):<br>
              &nbsp;&nbsp;&nbsp;&nbsp;result = a * b<br>
              &nbsp;&nbsp;&nbsp;&nbsp;<input type="text" id="q6_ret" class="quiz-input" style="width:95px;" placeholder="keyword" /> result<br><br>
              print(multiply(4, 5))  <span># Expected Output: 20</span>
            </div>
            <div class="minpy-btn-row">
              <button type="button" class="run-btn" onclick="minpyCheckC6()">${escapeHtml(lab.checkBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyShowHint(6)">${escapeHtml(lab.hintBtn)}</button>
              <button type="button" class="minpy-sec-btn" onclick="minpyResetChallenge(6, ['q6_def', 'q6_ret'])">${escapeHtml(lab.resetBtn)}</button>
            </div>
            <div id="fb-6" class="feedback"></div>
          </div>
        </section>
      `;

      wrapper.innerHTML = `
        <div class="minpy-top-bar">
          <span class="tag">${escapeHtml(data.badgeText)}</span>
          <button type="button" class="minpy-lang-btn" onclick="minpyToggleLang()">${escapeHtml(data.langBtnText)}</button>
        </div>
        <p class="minpy-meta-info">${escapeHtml(data.metaText)}</p>
        <h1>${escapeHtml(data.title)}</h1>
        <div class="minpy-abstract">
          <strong class="welcome-banner">${escapeHtml(data.welcome)}</strong>
          ${escapeHtml(data.abstract)}
        </div>
        <div class="minpy-roadmap">${roadmapHtml}</div>
        <nav class="minpy-toc">
          <div class="minpy-toc-title">${escapeHtml(data.tocTitle)}</div>
          <div class="minpy-toc-grid">${tocHtml}</div>
        </nav>
        ${lessonsHtml}
        ${labHtml}
      `;

      updateProgressUI();
    }

    function setFeedback(num, type, message) {
      const fb = document.getElementById("fb-" + num);
      if (!fb) return;
      fb.className = "feedback " + type;
      fb.textContent = message;
    }

    function updateProgressUI() {
      const weights = { 1: 10, 2: 15, 3: 15, 4: 20, 5: 20, 6: 20 };
      let count = 0;
      let points = 0;
      for (let i = 1; i <= 6; i++) {
        if (solvedChallenges[i]) {
          count++;
          points += weights[i];
        }
      }
      const progText = document.getElementById("lab-progress-text");
      const progFill = document.getElementById("lab-progress-fill");
      const ptsText = document.getElementById("lab-total-points");
      const unit = LECTURE_CONTENT[currentLang].lab.scoreUnit;

      if (progText) progText.textContent = count + " / 6";
      if (progFill) progFill.style.width = Math.round((count / 6) * 100) + "%";
      if (ptsText) ptsText.textContent = points + " / 100 " + unit;
    }

    window.minpyShowHint = function (num) {
      const lab = LECTURE_CONTENT[currentLang].lab;
      setFeedback(num, "hint", lab["c" + num].hint);
    };

    window.minpyResetChallenge = function (num, inputIds) {
      inputIds.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
      const fb = document.getElementById("fb-" + num);
      if (fb) {
        fb.className = "feedback";
        fb.textContent = "";
      }
      solvedChallenges[num] = false;
      updateProgressUI();
    };

    window.minpyCheckC1 = function () {
      const fn = document.getElementById("q1_fn").value.trim();
      const sep = document.getElementById("q1_sep").value.trim();
      const c = LECTURE_CONTENT[currentLang].lab.c1;
      if (fn === "print" && sep === "-") {
        solvedChallenges[1] = true;
        setFeedback(1, "ok", c.ok);
      } else {
        solvedChallenges[1] = false;
        setFeedback(1, "err", c.err);
      }
      updateProgressUI();
    };

    window.minpyCheckC2 = function () {
      const val = document.getElementById("q2_cast").value.trim();
      const c = LECTURE_CONTENT[currentLang].lab.c2;
      if (val === "int") {
        solvedChallenges[2] = true;
        setFeedback(2, "ok", c.ok);
      } else {
        solvedChallenges[2] = false;
        setFeedback(2, "err", c.err);
      }
      updateProgressUI();
    };

    window.minpyCheckC3 = function () {
      const val = document.getElementById("q3_idx").value.trim();
      const c = LECTURE_CONTENT[currentLang].lab.c3;
      if (val === "0") {
        solvedChallenges[3] = true;
        setFeedback(3, "ok", c.ok);
      } else {
        solvedChallenges[3] = false;
        setFeedback(3, "err", c.err);
      }
      updateProgressUI();
    };

    window.minpyCheckC4 = function () {
      const val = document.getElementById("q4_op").value.trim();
      const c = LECTURE_CONTENT[currentLang].lab.c4;
      if (val === "%") {
        solvedChallenges[4] = true;
        setFeedback(4, "ok", c.ok);
      } else {
        solvedChallenges[4] = false;
        setFeedback(4, "err", c.err);
      }
      updateProgressUI();
    };

    window.minpyCheckC5 = function () {
      const v1 = document.getElementById("q5_if").value.trim();
      const v2 = document.getElementById("q5_else").value.trim();
      const c = LECTURE_CONTENT[currentLang].lab.c5;
      if (v1 === "if" && v2 === "else") {
        solvedChallenges[5] = true;
        setFeedback(5, "ok", c.ok);
      } else {
        solvedChallenges[5] = false;
        setFeedback(5, "err", c.err);
      }
      updateProgressUI();
    };

    window.minpyCheckC6 = function () {
      const v1 = document.getElementById("q6_def").value.trim();
      const v2 = document.getElementById("q6_ret").value.trim();
      const c = LECTURE_CONTENT[currentLang].lab.c6;
      if (v1 === "def" && v2 === "return") {
        solvedChallenges[6] = true;
        setFeedback(6, "ok", c.ok);
      } else {
        solvedChallenges[6] = false;
        setFeedback(6, "err", c.err);
      }
      updateProgressUI();
    };

    window.minpyToggleLang = function () {
      currentLang = currentLang === "ar" ? "en" : "ar";
      renderUnit();
    };

    renderUnit();
  })();
</script>
