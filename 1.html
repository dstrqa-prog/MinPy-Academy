<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MinPy Academy | أكاديمية MinPy — المنهج التأسيسي الكامل</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --paper: #ffffff;
      --surface-soft: #f8fafc;
      --surface-tint: #eef2ff;
      --border: #dce3ec;
      --border-strong: #cbd5e1;
      --navy: #1e3a5f;
      --navy-hover: #152a45;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --text: #1f2937;
      --heading: #0f172a;
      --subtext: #334155;
      --muted: #64748b;
      --code-bg: #f8fafc;
      --code-border: #cbd5e1;
      --inline-code-bg: #f1f5f9;
      --input-bg: #ffffff;
      --success: #15803d;
      --success-bg: #f0fdf4;
      --success-border: #86efac;
      --error: #b91c1c;
      --error-bg: #fef2f2;
      --error-border: #fca5a5;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fcd34d;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      --radius-sm: 6px;
      --radius-md: 8px;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --paper: #1e293b;
      --surface-soft: #172033;
      --surface-tint: rgba(96, 165, 250, 0.12);
      --border: #334155;
      --border-strong: #475569;
      --navy: #172554;
      --navy-hover: #1e3a8a;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.16);
      --text: #e2e8f0;
      --heading: #f8fafc;
      --subtext: #cbd5e1;
      --muted: #94a3b8;
      --code-bg: #0b1120;
      --code-border: #334155;
      --inline-code-bg: #0f172a;
      --input-bg: #0f172a;
      --success: #4ade80;
      --success-bg: rgba(21, 128, 61, 0.22);
      --success-border: #166534;
      --error: #f87171;
      --error-bg: rgba(185, 28, 28, 0.22);
      --error-border: #991b1b;
      --warn: #fbbf24;
      --warn-bg: rgba(180, 83, 9, 0.22);
      --warn-border: #92400e;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.9;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      background: var(--navy);
      color: #ffffff;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      font-weight: 800;
      font-size: 1.18rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .brand-sub {
      font-size: 0.85rem;
      font-weight: 400;
      color: #cbd5e1;
      padding-inline-start: 12px;
      border-inline-start: 1px solid rgba(255, 255, 255, 0.25);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.32);
      padding: 5px 13px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.24); }

    .course-tag {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 4px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 700;
    }

    main {
      flex: 1;
      max-width: 980px;
      width: 100%;
      margin: 28px auto 40px;
      padding: 0 20px;
    }

    .lecture-sheet {
      background: var(--paper);
      border: 1px solid var(--border);
      border-top: 5px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 44px 48px;
      box-shadow: var(--shadow);
    }

    .lecture-header-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-block;
      background: var(--surface-tint);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.84rem;
      font-weight: 700;
      border: 1px solid var(--accent-soft);
    }

    .meta-info {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 600;
    }

    h1.lecture-title {
      font-size: 1.9rem;
      color: var(--heading);
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
      margin-bottom: 22px;
      font-weight: 800;
      line-height: 1.35;
    }

    .lecture-abstract {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-inline-start: 4px solid var(--navy);
      padding: 16px 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 26px;
      color: var(--subtext);
      font-size: 1.02rem;
    }

    .toc-box {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 32px;
    }

    .toc-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--heading);
      margin-bottom: 10px;
    }

    .toc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }

    .toc-link {
      display: block;
      text-decoration: none;
      color: var(--accent);
      background: var(--paper);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.89rem;
      font-weight: 600;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .toc-link:hover {
      border-color: var(--accent);
      background: var(--surface-tint);
    }

    section.unit-section {
      margin-top: 42px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    h2.unit-heading {
      font-size: 1.42rem;
      color: var(--heading);
      font-weight: 800;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    p.body-para {
      margin-bottom: 15px;
      font-size: 1.05rem;
      color: var(--subtext);
    }

    .kid-card {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin: 18px 0;
    }

    .kid-card-title {
      font-weight: 800;
      color: var(--warn);
      font-size: 0.98rem;
      margin-bottom: 6px;
      display: block;
    }

    .kid-card p {
      color: var(--text);
      font-size: 1.02rem;
      margin-bottom: 6px;
    }

    .kid-card p:last-child { margin-bottom: 0; }

    .formal-note {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-inline-start: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 15px 18px;
      margin: 18px 0;
      font-size: 0.98rem;
      color: var(--subtext);
    }

    .formal-note strong { color: var(--heading); }

    code.inline-code {
      background: var(--inline-code-bg);
      color: var(--heading);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.92em;
      direction: ltr;
      display: inline-block;
    }

    pre.code-block {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-inline-start: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      margin: 16px 0;
      direction: ltr;
      text-align: left;
      font-family: "Consolas", "Courier New", monospace;
      color: var(--heading);
      overflow-x: auto;
      font-size: 0.96rem;
      line-height: 1.65;
    }

    .output-box {
      background: var(--surface-soft);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin: -6px 0 18px;
      direction: ltr;
      text-align: left;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .output-label {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
      margin: 18px 0 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    table.acad-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.96rem;
    }

    table.acad-table th {
      background: var(--navy);
      color: #ffffff;
      padding: 12px 14px;
      text-align: start;
      font-weight: 700;
    }

    table.acad-table td {
      padding: 11px 14px;
      border-top: 1px solid var(--border);
      color: var(--subtext);
      vertical-align: top;
    }

    table.acad-table tr:nth-child(even) td { background: var(--surface-soft); }

    .lab-card {
      background: var(--surface-soft);
      border: 1px solid var(--border-strong);
      border-top: 4px solid var(--navy);
      border-radius: var(--radius-md);
      padding: 24px 26px;
      margin: 22px 0;
    }

    .lab-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .lab-badge {
      background: var(--navy);
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .lab-score {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent);
    }

    .code-editor-box {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      margin: 14px 0;
      direction: ltr;
      text-align: left;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.96rem;
      line-height: 1.85;
      color: var(--heading);
      overflow-x: auto;
    }

    .quiz-input {
      background: var(--input-bg);
      border: 1.5px solid var(--accent);
      color: var(--heading);
      padding: 3px 9px;
      border-radius: 4px;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.94rem;
      width: 145px;
      text-align: center;
      font-weight: 700;
      margin: 2px 3px;
    }

    .quiz-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .action-btn {
      background: var(--navy);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.93rem;
    }

    .action-btn:hover { background: var(--navy-hover); }

    .secondary-btn {
      background: var(--paper);
      color: var(--heading);
      border: 1px solid var(--border-strong);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .secondary-btn:hover { border-color: var(--accent); }

    .feedback {
      margin-top: 14px;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.95rem;
      display: none;
    }

    .feedback.ok {
      display: block;
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
    }

    .feedback.err {
      display: block;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error);
    }

    .feedback.hint {
      display: block;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn);
    }

    .mcq-option {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 0.98rem;
      color: var(--text);
    }

    .mcq-option:hover { border-color: var(--accent); }
    .mcq-option input { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }

    footer {
      background: var(--paper);
      border-top: 1px solid var(--border);
      padding: 20px 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 680px) {
      .lecture-sheet { padding: 26px 18px; }
      h1.lecture-title { font-size: 1.5rem; }
      .brand-sub { display: none; }
      .quiz-input { width: 118px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">

      <div class="course-tag" id="lecture-tag">المحاضرة 01</div>

  <main>
    <article class="lecture-sheet" id="lecture-root"></article>

  <footer>

  </footer>

  <script>

          {

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", currentTheme);
      const t = LECTURE_CONTENT[currentLang];
      const themeBtn = document.getElementById("theme-btn");
      if (themeBtn) themeBtn.textContent = currentTheme === "light" ? t.themeToDark : t.themeToLight;
    }

    function toggleTheme() {
      currentTheme = currentTheme === "light" ? "dark" : "light";
      localStorage.setItem(STORAGE_THEME_KEY, currentTheme);
      applyTheme();
    }

    function toggleLanguage() {
      currentLang = currentLang === "ar" ? "en" : "ar";
      localStorage.setItem(STORAGE_LANG_KEY, currentLang);
      renderLecture();
    }

    function renderSectionHtml(sec) {
      const parasHtml = sec.paragraphs.map((p) => `<p class="body-para">${escapeHtml(p)}</p>`).join("\n");
      const kidLinesHtml = sec.kid.lines.map((line) => `<p>${escapeHtml(line)}</p>`).join("\n");
      const kidHtml = `
        <div class="kid-card">
          <span class="kid-card-title">${escapeHtml(sec.kid.title)}</span>
          ${kidLinesHtml}
        </div>
      `;

      let tableHtml = "";
      if (sec.table) {
        const thHtml = sec.table.headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("");
        const trHtml = sec.table.rows
          .map((row) => `<tr>${row.map((cell) => `<td><code class="inline-code">${escapeHtml(cell)}</code></td>`).join("")}</tr>`)
          .join("\n");
        tableHtml = `<div class="table-wrap"><table class="acad-table"><thead><tr>${thHtml}</tr></thead><tbody>${trHtml}</tbody></table></div>`;
      }

      const codeHtml = sec.code ? `<pre class="code-block">${escapeHtml(sec.code)}</pre>` : "";
      const outputHtml = sec.output
        ? `<div class="output-box"><span class="output-label">Output</span>${escapeHtml(sec.output).replace(/\n/g, "<br>")}</div>`
        : "";
      const noteHtml = sec.note
        ? `<div class="formal-note"><strong>${escapeHtml(sec.note.strong)}</strong> ${escapeHtml(sec.note.text)}</div>`
        : "";

      return `
        <section class="unit-section" id="${escapeHtml(sec.id)}">
          <h2 class="unit-heading">${escapeHtml(sec.heading)}</h2>
          ${parasHtml}
          ${kidHtml}
          ${tableHtml}
          ${codeHtml}
          ${outputHtml}
          ${noteHtml}
        </section>
      `;
    }

          (opt, idx) => `
            <label class="mcq-option" for="mcq_opt_${idx}">
              <input type="radio" name="mcq_choice" id="mcq_opt_${idx}" value="${escapeHtml(opt.value)}" />
              <span>${escapeHtml(opt.text)}</span>
            </label>
          `
        )
        .join("\n");

      return `
        <section class="unit-section" id="${escapeHtml(lab.id)}">
          <h2 class="unit-heading">${escapeHtml(lab.heading)}</h2>
          <p class="body-para">${escapeHtml(lab.intro)}</p>

          <div class="lab-card">
            <div class="lab-header">
              <span class="lab-badge">${escapeHtml(lab.ex1Title)}</span>
              <span class="lab-score" id="lab-score-display">${escapeHtml(lab.totalScoreLabel(earned, total))}</span>
            </div>
            <p class="body-para">${escapeHtml(lab.ex1Desc)}</p>
            <div class="code-editor-box">
              student <input type="text" id="ex1_a" class="quiz-input" placeholder="=" /> "Nadia"<br>
              points = <input type="text" id="ex1_b" class="quiz-input" placeholder="int" />("40")<br>
              <input type="text" id="ex1_c" class="quiz-input" placeholder="print" />(student, points + 10)
            </div>
            <div class="btn-row">
              <button type="button" class="action-btn" onclick="checkExercise1()">${escapeHtml(lab.ex1CheckBtn)}</button>
              <button type="button" class="secondary-btn" onclick="showHint('ex1_fb', '${escapeHtml(lab.ex1Hint.replace(/'/g, "\\'"))}')">${escapeHtml(lab.ex1HintBtn)}</button>
            </div>
            <div class="feedback" id="ex1_fb"></div>
          </div>

          <div class="lab-card">
            <div class="lab-header"><span class="lab-badge">${escapeHtml(lab.ex2Title)}</span></div>
            <p class="body-para">${escapeHtml(lab.ex2Desc)}</p>
            <div class="code-editor-box">
              mark = 82<br>
              <input type="text" id="ex2_a" class="quiz-input" placeholder="if" /> mark &gt;= 90:<br>
              &nbsp;&nbsp;&nbsp;&nbsp;grade = "A"<br>
              <input type="text" id="ex2_b" class="quiz-input" placeholder="elif" /> mark &gt;= 75:<br>
              &nbsp;&nbsp;&nbsp;&nbsp;grade = "B"<br>
              <input type="text" id="ex2_c" class="quiz-input" placeholder="else" />:<br>
              &nbsp;&nbsp;&nbsp;&nbsp;grade = "C"
            </div>
            <div class="btn-row">
              <button type="button" class="action-btn" onclick="checkExercise2()">${escapeHtml(lab.ex2CheckBtn)}</button>
              <button type="button" class="secondary-btn" onclick="showHint('ex2_fb', '${escapeHtml(lab.ex2Hint.replace(/'/g, "\\'"))}')">${escapeHtml(lab.ex2HintBtn)}</button>
            </div>
            <div class="feedback" id="ex2_fb"></div>
          </div>

          <div class="lab-card">
            <div class="lab-header"><span class="lab-badge">${escapeHtml(lab.ex3Title)}</span></div>
            <p class="body-para">${escapeHtml(lab.ex3Desc)}</p>
            <div class="code-editor-box">
              <input type="text" id="ex3_a" class="quiz-input" placeholder="for" /> i in <input type="text" id="ex3_b" class="quiz-input" placeholder="range" />(4):<br>
              &nbsp;&nbsp;&nbsp;&nbsp;<input type="text" id="ex3_c" class="quiz-input" placeholder="print" />(i)
            </div>
            <div class="btn-row">
              <button type="button" class="action-btn" onclick="checkExercise3()">${escapeHtml(lab.ex3CheckBtn)}</button>
              <button type="button" class="secondary-btn" onclick="showHint('ex3_fb', '${escapeHtml(lab.ex3Hint.replace(/'/g, "\\'"))}')">${escapeHtml(lab.ex3HintBtn)}</button>
            </div>
            <div class="feedback" id="ex3_fb"></div>
          </div>

          <div class="lab-card">
            <div class="lab-header"><span class="lab-badge">${escapeHtml(lab.ex4Title)}</span></div>
            <p class="body-para">${escapeHtml(lab.ex4Desc)}</p>
            <div class="code-editor-box">
              <input type="text" id="ex4_a" class="quiz-input" placeholder="def" /> add_item(items, new_val):<br>
              &nbsp;&nbsp;&nbsp;&nbsp;items.<input type="text" id="ex4_b" class="quiz-input" placeholder="append" />(new_val)<br>
              &nbsp;&nbsp;&nbsp;&nbsp;<input type="text" id="ex4_c" class="quiz-input" placeholder="return" /> len(items)
            </div>
            <div class="btn-row">
              <button type="button" class="action-btn" onclick="checkExercise4()">${escapeHtml(lab.ex4CheckBtn)}</button>
              <button type="button" class="secondary-btn" onclick="showHint('ex4_fb', '${escapeHtml(lab.ex4Hint.replace(/'/g, "\\'"))}')">${escapeHtml(lab.ex4HintBtn)}</button>
            </div>
            <div class="feedback" id="ex4_fb"></div>
          </div>

          <div class="lab-card">
            <div class="lab-header"><span class="lab-badge">${escapeHtml(lab.ex5Title)}</span></div>
            <p class="body-para">${escapeHtml(lab.ex5Desc)}</p>
            <div class="code-editor-box">
              <input type="text" id="ex5_a" class="quiz-input" placeholder="try" />:<br>
              &nbsp;&nbsp;&nbsp;&nbsp;print(50 / 0)<br>
              <input type="text" id="ex5_b" class="quiz-input" placeholder="except" /> ZeroDivisionError:<br>
              &nbsp;&nbsp;&nbsp;&nbsp;print("Cannot divide by zero")
            </div>
            <div class="btn-row">
              <button type="button" class="action-btn" onclick="checkExercise5()">${escapeHtml(lab.ex5CheckBtn)}</button>
              <button type="button" class="secondary-btn" onclick="showHint('ex5_fb', '${escapeHtml(lab.ex5Hint.replace(/'/g, "\\'"))}')">${escapeHtml(lab.ex5HintBtn)}</button>
            </div>
            <div class="feedback" id="ex5_fb"></div>
          </div>

          <div class="lab-card">
            <div class="lab-header"><span class="lab-badge">${escapeHtml(lab.mcqTitle)}</span></div>
            <p class="body-para"><strong>${escapeHtml(lab.mcqQuestion)}</strong></p>
            <div style="margin-top: 10px;">${mcqOptionsHtml}</div>
            <div class="btn-row">
              <button type="button" class="action-btn" onclick="checkMcq()">${escapeHtml(lab.mcqCheckBtn)}</button>
            </div>
            <div class="feedback" id="mcq_fb"></div>
          </div>
        </section>
      `;
    }

    function renderLecture() {
      const data = LECTURE_CONTENT[currentLang];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = data.dir;

      document.getElementById("brand-name").textContent = data.brandName;
      document.getElementById("brand-sub").textContent = data.brandSub;
      document.getElementById("lang-btn").textContent = data.langToEn;
      document.getElementById("lecture-tag").textContent = data.lectureTag;
      document.getElementById("footer-text").textContent = data.footerText;

      const tocHtml = data.toc
        .map((item) => `<a class="toc-link" href="${escapeHtml(item.href)}">${escapeHtml(item.label)}</a>`)
        .join("\n");
      const sectionsHtml = data.sections.map((sec) => renderSectionHtml(sec)).join("\n");
      const labHtml = renderLabHtml(data.lab);

      document.getElementById("lecture-root").innerHTML = `
        <div class="lecture-header-meta">
          <span class="tag">${escapeHtml(data.badgeText)}</span>
          <span class="meta-info">${escapeHtml(data.metaText)}</span>
        </div>
        <h1 class="lecture-title">${escapeHtml(data.title)}</h1>
        <div class="lecture-abstract">${escapeHtml(data.abstract)}</div>
        <nav class="toc-box" aria-label="Lecture Outline">
          <div class="toc-title">${escapeHtml(data.tocTitle)}</div>
          <div class="toc-grid">${tocHtml}</div>
        </nav>
        ${sectionsHtml}
        ${labHtml}
      `;
      applyTheme();
    }

    function updateScoreBadge() {
      const lab = LECTURE_CONTENT[currentLang].lab;
      const earned = Object.values(labResults).filter(Boolean).length;
      const total = Object.keys(labResults).length;
      const badge = document.getElementById("lab-score-display");
      if (badge) badge.textContent = lab.totalScoreLabel(earned, total);
    }

    function setFeedback(elId, type, message) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.className = `feedback ${type}`;
      el.textContent = message;
    }

    function showHint(elId, hintText) {
      setFeedback(elId, "hint", hintText);
    }

    function checkExercise1() {
      const lab = LECTURE_CONTENT[currentLang].lab;
      const a = document.getElementById("ex1_a").value.trim();
      const b = document.getElementById("ex1_b").value.trim();
      const c = document.getElementById("ex1_c").value.trim();
      labResults.ex1 = (a === "=" && b === "int" && c === "print");
      setFeedback("ex1_fb", labResults.ex1 ? "ok" : "err", labResults.ex1 ? lab.ex1Ok : lab.ex1Err);
      updateScoreBadge();
    }

    function checkExercise2() {
      const lab = LECTURE_CONTENT[currentLang].lab;
      const a = document.getElementById("ex2_a").value.trim();
      const b = document.getElementById("ex2_b").value.trim();
      const c = document.getElementById("ex2_c").value.trim();
      labResults.ex2 = (a === "if" && b === "elif" && c === "else");
      setFeedback("ex2_fb", labResults.ex2 ? "ok" : "err", labResults.ex2 ? lab.ex2Ok : lab.ex2Err);
      updateScoreBadge();
    }

    function checkExercise3() {
      const lab = LECTURE_CONTENT[currentLang].lab;
      const a = document.getElementById("ex3_a").value.trim();
      const b = document.getElementById("ex3_b").value.trim();
      const c = document.getElementById("ex3_c").value.trim();
      labResults.ex3 = (a === "for" && b === "range" && c === "print");
      setFeedback("ex3_fb", labResults.ex3 ? "ok" : "err", labResults.ex3 ? lab.ex3Ok : lab.ex3Err);
      updateScoreBadge();
    }

    function checkExercise4() {
      const lab = LECTURE_CONTENT[currentLang].lab;
      const a = document.getElementById("ex4_a").value.trim();
      const b = document.getElementById("ex4_b").value.trim();
      const c = document.getElementById("ex4_c").value.trim();
      labResults.ex4 = (a === "def" && b === "append" && c === "return");
      setFeedback("ex4_fb", labResults.ex4 ? "ok" : "err", labResults.ex4 ? lab.ex4Ok : lab.ex4Err);
      updateScoreBadge();
    }

    function checkExercise5() {
      const lab = LECTURE_CONTENT[currentLang].lab;
      const a = document.getElementById("ex5_a").value.trim();
      const b = document.getElementById("ex5_b").value.trim();
      labResults.ex5 = (a === "try" && b === "except");
      setFeedback("ex5_fb", labResults.ex5 ? "ok" : "err", labResults.ex5 ? lab.ex5Ok : lab.ex5Err);
      updateScoreBadge();
    }

    function checkMcq() {
      const lab = LECTURE_CONTENT[currentLang].lab;
      const selected = document.querySelector('input[name="mcq_choice"]:checked');
      labResults.mcq = Boolean(selected && selected.value === "3");
      setFeedback("mcq_fb", labResults.mcq ? "ok" : "err", labResults.mcq ? lab.mcqOk : lab.mcqErr);
      updateScoreBadge();
    }

    renderLecture();
  </script>
</body>
</html>
